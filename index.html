<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Comando Regional Moquegua - Sistema de Control Electoral</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col justify-between">

    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-red-600 text-white font-black px-3 py-1.5 rounded-lg text-sm tracking-wider shadow">MOQ</div>
                <div>
                    <h1 class="text-base font-bold tracking-tight">COMANDO REGIONAL DE CAMPAÑA</h1>
                    <p class="text-xs text-slate-400">Sistema de Control y Monitoreo Electoral 2026</p>
                </div>
            </div>
            <div id="userHeaderInfo" class="hidden flex items-center gap-4">
                <span id="userRoleBadge" class="text-xs font-bold px-2.5 py-1 bg-slate-800 text-emerald-400 rounded-full border border-slate-700"></span>
                <button onclick="logout()" class="text-xs text-slate-300 hover:text-white font-semibold underline">Salir</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
        <!-- VISTA LOGIN -->
        <section id="loginView" class="max-w-md mx-auto mt-12">
            <div class="bg-white rounded-2xl shadow-xl border border-slate-200 p-8 space-y-6">
                <div class="text-center space-y-2">
                    <div class="inline-block p-3 bg-red-50 text-red-600 rounded-2xl text-2xl font-black mb-1">DNI</div>
                    <h2 class="text-2xl font-black text-slate-900">Acceso Personeros</h2>
                    <p class="text-sm text-slate-500">Ingrese su DNI de 8 dígitos autorizado (Admin: 41414141).</p>
                </div>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Número de DNI</label>
                        <input id="dniInput" type="text" inputmode="numeric" maxlength="8" placeholder="Ej. 41414141" class="w-full px-4 py-3 border border-slate-300 rounded-xl font-bold text-lg text-center tracking-widest focus:ring-2 focus:ring-red-500 outline-none">
                    </div>
                    <button onclick="handleLogin()" class="w-full py-3.5 bg-red-600 hover:bg-red-700 text-white font-black rounded-xl shadow-lg transition">
                        Ingresar al Sistema
                    </button>
                    <div id="loginError" class="text-xs font-semibold text-center text-red-600 hidden"></div>
                </div>
            </div>
        </section>

        <!-- VISTA ADMIN / DASHBOARD -->
        <section id="adminView" class="hidden space-y-6">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <h3 class="text-xl font-black text-slate-900">Panel de Administración General</h3>
                <p class="text-sm text-slate-500">Sesión de Administrador iniciada correctamente.</p>
            </div>
        </section>
    </main>

    <script>
        // CONFIGURA TUS CREDENCIALES DIRECTAMENTE AQUÍ:
        const SUPABASE_URL = "https://smqeofxvzekliozszjwo.supabase.co/rest/v1/"; // Reemplaza con tu URL real
        const SUPABASE_ANON_KEY = "sb_publishable_hpP9voD4xsFwTjhZmbcj-A_E5jGrjOS"; // Reemplaza con tu Key real
        
        let supabase = null;
        try {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch(e) { console.error("Error iniciando Supabase", e); }

        async function handleLogin() {
            const dni = document.getElementById('dniInput').value.trim();
            const errDiv = document.getElementById('loginError');
            errDiv.classList.add('hidden');

            if (dni === "41414141") {
                document.getElementById('loginView').classList.add('hidden');
                document.getElementById('adminView').classList.remove('hidden');
                document.getElementById('userHeaderInfo').classList.remove('hidden');
                document.getElementById('userRoleBadge').textContent = "ADMINISTRADOR GENERAL";
                return;
            }

            if (!/^\d{8}$/.test(dni)) {
                errDiv.textContent = "Ingrese un DNI válido de 8 dígitos.";
                errDiv.classList.remove('hidden');
                return;
            }

            if(!supabase) {
                errDiv.textContent = "Supabase no está configurado en el código.";
                errDiv.classList.remove('hidden');
                return;
            }

            const { data, error } = await supabase.from('mesas_padron').select('*').or(`dni_personero_mesa.eq.${dni},dni_personero_local.eq.${dni}`);
            if (error || !data || data.length === 0) {
                errDiv.textContent = "DNI no autorizado en el padrón.";
                errDiv.classList.remove('hidden');
            } else {
                alert("Acceso concedido como personero.");
            }
        }

        function logout() {
            document.getElementById('adminView').classList.add('hidden');
            document.getElementById('loginView').classList.remove('hidden');
            document.getElementById('userHeaderInfo').classList.add('hidden');
            document.getElementById('dniInput').value = '';
        }
    </script>
</body>
</html>
